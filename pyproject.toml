[project]
name = "langgraph-learning"
version = "0.1.0"
description = "A hands-on LangGraph learning lab built around a research assistant"
readme = "README.md"
authors = [
    { name = "Stanislav Liashevskyi", email = "liashevskiys@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.4.9",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langgraph>=1.2.9",
]

[project.scripts]
langgraph-learning = "langgraph_learning:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
